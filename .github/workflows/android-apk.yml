name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Tools and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Download SDL2 Libraries
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-2.30.8.tar.gz
          wget -q https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz
          wget -q https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-2.8.0.tar.gz
          tar -xzf SDL2-2.30.8.tar.gz
          tar -xzf SDL2_image-2.8.2.tar.gz
          tar -xzf SDL2_mixer-2.8.0.tar.gz

      - name: Prepare Android Project and Assets
        run: |
          cp -r SDL2-2.30.8/android-project ./android-build
          mv SDL2-2.30.8 ./android-build/app/jni/SDL2
          mv SDL2_image-2.8.2 ./android-build/app/jni/SDL2_image
          mv SDL2_mixer-2.8.0 ./android-build/app/jni/SDL2_mixer

          cp $ANDROID_HOME/ndk/26.1.10909125/sources/android/cpufeatures/cpu-features.c ./android-build/app/jni/SDL2/src/cpuinfo/
          cp $ANDROID_HOME/ndk/26.1.10909125/sources/android/cpufeatures/cpu-features.h ./android-build/app/jni/SDL2/include/
          sed -i '/import-module/d' ./android-build/app/jni/SDL2/Android.mk
          sed -i 's/cpufeatures//g' ./android-build/app/jni/SDL2/Android.mk

          mkdir -p ./android-build/app/jni/compat_include/SDL2
          cp -r ./android-build/app/jni/SDL2/include/* ./android-build/app/jni/compat_include/SDL2/
          cp -r ./android-build/app/jni/SDL2_image/include/* ./android-build/app/jni/compat_include/SDL2/
          cp -r ./android-build/app/jni/SDL2_mixer/include/* ./android-build/app/jni/compat_include/SDL2/

          rm -rf ./android-build/app/jni/src/*
          cp -r src/* ./android-build/app/jni/src/

          mkdir -p ./android-build/app/src/main/assets
          cp -r assets/* ./android-build/app/src/main/assets/
          for svgfile in ./android-build/app/src/main/assets/*.svg; do
            if [ -f "$svgfile" ]; then
              pngfile="${svgfile%.svg}.png"
              rsvg-convert "$svgfile" -o "$pngfile"
            fi
          done

      - name: Generate Self-Contained Android.mk Files
        run: |
          printf "LOCAL_PATH := \$(call my-dir)\n" > ./android-build/app/jni/Android.mk
          printf "include \$(call all-subdir-makefiles)\n" >> ./android-build/app/jni/Android.mk

          printf "LOCAL_PATH := \$(call my-dir)\n" > ./android-build/app/jni/SDL2_image/Android.mk
          printf "include \$(CLEAR_VARS)\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_MODULE := SDL2_image\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_C_INCLUDES := \$(LOCAL_PATH)/include \$(LOCAL_PATH)/src \$(LOCAL_PATH)/../SDL2/include\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_CFLAGS := -DLOAD_BMP -DLOAD_PNG -DLOAD_JPG -DLOAD_SVG -DUSE_STBIMAGE -DSDL_IMAGE_USE_COMMON_BACKEND\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_SRC_FILES := \$(notdir \$(wildcard \$(LOCAL_PATH)/src/*.c))\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_SRC_FILES := \$(addprefix src/,\$(LOCAL_SRC_FILES))\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "LOCAL_SHARED_LIBRARIES := SDL2\n" >> ./android-build/app/jni/SDL2_image/Android.mk
          printf "include \$(BUILD_SHARED_LIBRARY)\n" >> ./android-build/app/jni/SDL2_image/Android.mk

          printf "LOCAL_PATH := \$(call my-dir)\n" > ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "include \$(CLEAR_VARS)\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_MODULE := SDL2_mixer\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_C_INCLUDES := \$(LOCAL_PATH)/include \$(LOCAL_PATH)/src \$(LOCAL_PATH)/src/codecs \$(LOCAL_PATH)/../SDL2/include\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_CFLAGS := -DMUSIC_WAV\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_SRC_FILES := \$(notdir \$(wildcard \$(LOCAL_PATH)/src/*.c)) \$(addprefix codecs/,\$(notdir \$(wildcard \$(LOCAL_PATH)/src/codecs/*.c)))\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_SRC_FILES := \$(addprefix src/,\$(LOCAL_SRC_FILES))\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "LOCAL_SHARED_LIBRARIES := SDL2\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk
          printf "include \$(BUILD_SHARED_LIBRARY)\n" >> ./android-build/app/jni/SDL2_mixer/Android.mk

          CPP_FILES=$(cd ./android-build/app/jni/src && find . -name "*.cpp" | sed 's|^\./||' | tr '\n' ' ')
          printf "LOCAL_PATH := \$(call my-dir)\n" > ./android-build/app/jni/src/Android.mk
          printf "include \$(CLEAR_VARS)\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_MODULE := main\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_C_INCLUDES := \$(LOCAL_PATH) \$(LOCAL_PATH)/../compat_include \$(LOCAL_PATH)/../SDL2/include \$(LOCAL_PATH)/../SDL2_image/include \$(LOCAL_PATH)/../SDL2_mixer/include\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_SRC_FILES := %s\n" "$CPP_FILES" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_CFLAGS := -std=c++17 -O2 -Wno-error\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_CPPFLAGS := -std=c++17 -O2 -frtti -fexceptions -Wno-error -Wno-c++11-narrowing\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_SHARED_LIBRARIES := SDL2 SDL2_image SDL2_mixer\n" >> ./android-build/app/jni/src/Android.mk
          printf "LOCAL_LDLIBS := -lGLESv1_CM -lGLESv2 -llog -landroid\n" >> ./android-build/app/jni/src/Android.mk
          printf "include \$(BUILD_SHARED_LIBRARY)\n" >> ./android-build/app/jni/src/Android.mk

          printf "APP_ABI := arm64-v8a\n" > ./android-build/app/jni/Application.mk
          printf "APP_PLATFORM := android-24\n" >> ./android-build/app/jni/Application.mk
          printf "APP_STL := c++_shared\n" >> ./android-build/app/jni/Application.mk
          printf "APP_CPPFLAGS := -std=c++17 -frtti -fexceptions -Wno-c++11-narrowing\n" >> ./android-build/app/jni/Application.mk
          printf "APP_ALLOW_MISSING_DEPS := true\n" >> ./android-build/app/jni/Application.mk

      - name: Compile NDK and Assemble APK
        run: |
          cd ./android-build
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config" "$HOME/.android" 2>/dev/null || true
          export ANDROID_USER_HOME="$GITHUB_WORKSPACE/.android-user"
          mkdir -p "$ANDROID_USER_HOME"
          keytool -genkeypair -noprompt -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/ndk/26.1.10909125/ndk-build -C app/jni APP_ALLOW_MISSING_DEPS=true -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -f app/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          sed -i 's/android:name="SDLActivity"/android:name="SDLActivity" android:screenOrientation="sensorLandscape"/g' app/src/main/AndroidManifest.xml
          sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          sed -i 's/\/\/[[:space:]]*"SDL2_image"/"SDL2_image"/g' app/src/main/java/org/libsdl/app/SDLActivity.java 2>/dev/null || true
          sed -i 's/\/\/[[:space:]]*"SDL2_mixer"/"SDL2_mixer"/g' app/src/main/java/org/libsdl/app/SDLActivity.java 2>/dev/null || true

          printf "include ':app'\n" > settings.gradle
          printf "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n" > gradle.properties

          printf "buildscript {\n" > build.gradle
          printf "    repositories {\n" >> build.gradle
          printf "        google()\n" >> build.gradle
          printf "        mavenCentral()\n" >> build.gradle
          printf "    }\n" >> build.gradle
          printf "    dependencies {\n" >> build.gradle
          printf "        classpath 'com.android.tools.build:gradle:8.1.4'\n" >> build.gradle
          printf "    }\n" >> build.gradle
          printf "}\n" >> build.gradle
          printf "allprojects {\n" >> build.gradle
          printf "    repositories {\n" >> build.gradle
          printf "        google()\n" >> build.gradle
          printf "        mavenCentral()\n" >> build.gradle
          printf "    }\n" >> build.gradle
          printf "}\n" >> build.gradle

          printf "plugins {\n" > app/build.gradle
          printf "    id 'com.android.application'\n" >> app/build.gradle
          printf "}\n" >> app/build.gradle
          printf "android {\n" >> app/build.gradle
          printf "    namespace 'org.libsdl.app'\n" >> app/build.gradle
          printf "    compileSdk 34\n" >> app/build.gradle
          printf "    defaultConfig {\n" >> app/build.gradle
          printf "        applicationId 'org.libsdl.atomicweapon'\n" >> app/build.gradle
          printf "        minSdk 24\n" >> app/build.gradle
          printf "        targetSdk 34\n" >> app/build.gradle
          printf "        versionCode 1\n" >> app/build.gradle
          printf "        versionName '1.0'\n" >> app/build.gradle
          printf "        ndk {\n" >> app/build.gradle
          printf "            abiFilters 'arm64-v8a'\n" >> app/build.gradle
          printf "        }\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    signingConfigs {\n" >> app/build.gradle
          printf "        debug {\n" >> app/build.gradle
          printf "            storeFile file(System.getenv('ANDROID_USER_HOME') + '/debug.keystore')\n" >> app/build.gradle
          printf "            storePassword 'android'\n" >> app/build.gradle
          printf "            keyAlias 'androiddebugkey'\n" >> app/build.gradle
          printf "            keyPassword 'android'\n" >> app/build.gradle
          printf "        }\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    buildTypes {\n" >> app/build.gradle
          printf "        debug {\n" >> app/build.gradle
          printf "            signingConfig signingConfigs.debug\n" >> app/build.gradle
          printf "        }\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    sourceSets {\n" >> app/build.gradle
          printf "        main {\n" >> app/build.gradle
          printf "            manifest.srcFile 'src/main/AndroidManifest.xml'\n" >> app/build.gradle
          printf "            java.srcDirs = ['src/main/java']\n" >> app/build.gradle
          printf "            res.srcDirs = ['src/main/res']\n" >> app/build.gradle
          printf "            assets.srcDirs = ['src/main/assets']\n" >> app/build.gradle
          printf "            jniLibs.srcDirs = ['src/main/jniLibs']\n" >> app/build.gradle
          printf "        }\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    lint {\n" >> app/build.gradle
          printf "        abortOnError false\n" >> app/build.gradle
          printf "        checkReleaseBuilds false\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    buildFeatures {\n" >> app/build.gradle
          printf "        buildConfig true\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "    compileOptions {\n" >> app/build.gradle
          printf "        sourceCompatibility JavaVersion.VERSION_1_8\n" >> app/build.gradle
          printf "        targetCompatibility JavaVersion.VERSION_1_8\n" >> app/build.gradle
          printf "    }\n" >> app/build.gradle
          printf "}\n" >> app/build.gradle

          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtomicTank-Android-APK
          path: ./android-build/app/build/outputs/apk/debug/*.apk
